# Run the Kinolab Next.js frontend behind Traefik/Dokploy at
# https://studio.kinolab.ai, against the self-hosted Convex backend at
# https://api.kinolab.ai (HTTP actions: https://actions.kinolab.ai). No host ports are published; Traefik reaches the
# container over the internal dokploy-network.
#
#   docker compose up -d --build
#
# NEXT_PUBLIC_CONVEX_URL is inlined into the browser bundle at build time, so
# changing it requires a rebuild (--build), not just a restart.
#
# Every `up` also pushes the convex/ functions to the self-hosted backend via
# the one-shot `convex-deploy` service, IF CONVEX_SELF_HOSTED_ADMIN_KEY is set
# in the environment (in Dokploy: the compose project's Environment tab).
# Without the key it logs a skip notice and the frontend deploys as before.
#
# The sign-up gate (INVITE_ONLY_SIGNUPS / ALLOW_OPEN_SIGNUPS /
# ADMIN_SIGNUP_ALLOWLIST) is NOT set here — those are read inside Convex
# functions, so they live on the backend: `npx convex env set …`. README
# §"Go-live checklist" has the full list.
#
# TLS: Cloudflare (proxied, SSL mode Full (strict)) -> Traefik `websecure`
# entrypoint, which serves the Cloudflare Origin Certificate for *.kinolab.ai
# from /etc/dokploy/traefik/dynamic/kinolab-tls.yml. HTTP -> HTTPS is handled
# by Cloudflare's "Always Use HTTPS", so no `web` router is needed here.

services:
  convex-deploy:
    build:
      context: .
      dockerfile: Dockerfile
      target: convex-deploy
    image: kinolab-convex-deploy
    # One-shot: runs `npx convex deploy` against the self-hosted backend and
    # exits. Must NOT auto-restart, or a failed push would retry forever.
    restart: "no"
    environment:
      # Public URL by default. Alternatively set CONVEX_SELF_HOSTED_URL to
      # http://kinolab-convex-backend:3210 to push over dokploy-network directly,
      # skipping the round trip through Cloudflare.
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-${NEXT_PUBLIC_DEPLOYMENT_URL:-https://api.kinolab.ai}}
      # Never commit this: set it in Dokploy's Environment (or the host shell).
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
    networks:
      - dokploy-network

  frontend:
    # Only (re)start the frontend after the backend functions were pushed
    # successfully, so a new frontend never serves against stale functions.
    # If the push FAILS, `up` aborts and the previously running frontend
    # container is left untouched (compose recreates dependents last).
    depends_on:
      convex-deploy:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-${NEXT_PUBLIC_DEPLOYMENT_URL:-https://api.kinolab.ai}}
        # Both origins end up in the Content-Security-Policy (next.config.ts),
        # which Next bakes in at BUILD time — hence build args, not env.
        # Make sure connect-src also allows wss://api.kinolab.ai (Convex client).
        NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL:-https://actions.kinolab.ai}
        # Comma-separated extra CSP origins; CSP_REPORT_ONLY=1 ships the policy
        # in report-only mode if something legitimate turns out to be blocked.
        CSP_EXTRA_ORIGINS: ${CSP_EXTRA_ORIGINS:-}
        CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-}
    image: kinolab-frontend
    restart: unless-stopped
    environment:
      # Read at runtime by any server-rendered route.
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-${NEXT_PUBLIC_DEPLOYMENT_URL:-https://api.kinolab.ai}}
      # This deployment is only ever reached via TLS-terminating proxies;
      # the middleware uses this to keep redirect URLs on https.
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      # Hosts whose Host header may be reflected into redirect URLs. Without
      # this an attacker-supplied Host lands in the sign-in redirect Location;
      # keep it in step with the Traefik rule below (comma-separated).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-studio.kinolab.ai}
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.kinolab-frontend.rule=Host(`studio.kinolab.ai`)
      - traefik.http.routers.kinolab-frontend.entrypoints=websecure
      - traefik.http.routers.kinolab-frontend.tls=true
      - traefik.http.routers.kinolab-frontend.service=kinolab-frontend-svc
      - traefik.http.services.kinolab-frontend-svc.loadbalancer.server.port=8090
    # HEALTHCHECK is inherited from the Dockerfile (hits /api/health on 8090).

networks:
  dokploy-network:
    external: true