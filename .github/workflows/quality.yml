name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_AGENT_MODE: anonymous
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          pnpm exec convex dev > "$RUNNER_TEMP/kinolab-convex.log" 2>&1 &
          kinolab_convex_pid=$!
          kinolab_convex_ready=0
          for attempt in $(seq 1 90); do
            if grep -q 'Convex functions ready' "$RUNNER_TEMP/kinolab-convex.log"; then
              kinolab_convex_ready=1
              break
            fi
            if ! kill -0 "$kinolab_convex_pid" 2>/dev/null; then
              tail -80 "$RUNNER_TEMP/kinolab-convex.log"
              exit 1
            fi
            sleep 1
          done
          if test "$kinolab_convex_ready" != 1; then
            tail -80 "$RUNNER_TEMP/kinolab-convex.log"
            exit 1
          fi
          node scripts/setup-auth.mjs
      - run: pnpm check
      - run: pnpm test:api
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            ${{ runner.temp }}/kinolab-convex.log
          retention-days: 7
