name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_AGENT_MODE: anonymous
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          pnpm exec convex dev > "$RUNNER_TEMP/kinolab-convex.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if test -f .env.local && curl -fsS http://127.0.0.1:3210/version >/dev/null; then break; fi
            sleep 1
          done
          pnpm exec convex dev --once
          node scripts/setup-auth.mjs
      - run: pnpm check
      - run: pnpm test:api
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
